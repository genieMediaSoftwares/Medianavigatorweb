name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.ci.invalid
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: Frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform android --platform ios --output-dir dist-ci
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      API_BASE_URL: https://api.ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Build-time check only; real deployments set their own API address.
      API_BASE_URL: https://api.ci.invalid
      OPERATOR_NAME: CI Operator
      SUPPORT_EMAIL: support@ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
